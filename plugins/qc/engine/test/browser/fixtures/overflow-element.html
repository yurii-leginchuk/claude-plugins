<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Overflow element</title>
<style>body{margin:0;overflow-x:hidden}
#culprit{width:1200px;height:30px;background:#fbb}
#offcanvas{position:fixed;left:-9999px;top:0;width:300px;height:100px;background:#eee}
#slidein{position:fixed;left:100%;top:0;width:300px;height:100px;background:#ccc}</style>
</head><body><main><h1>Overflow</h1>
<div id="culprit">wide</div><div id="offcanvas">menu</div><div id="slidein">panel</div></main></body></html>
